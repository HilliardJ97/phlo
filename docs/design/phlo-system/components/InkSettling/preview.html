<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;800;900&family=Geist+Mono:wght@400;500&display=swap">
<style>
  body{margin:0;background:var(--paper);font-family:var(--font-sans)}
  .col{max-width:560px;margin:32px 40px}
