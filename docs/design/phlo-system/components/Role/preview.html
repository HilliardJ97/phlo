<!-- @dsCard group="Page" height=200 subtitle="Partner thinks with you. Scribe writes only what you say." -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@500&display=swap">
<style>
  body{margin:0;background:var(--paper);font-family:var(--font-sans)}
  .row{display:flex;gap:56px;padding:40px;align-items:flex-start}
  .sw{display:inline-flex;border:1px solid var(--hairline);border-radius:var(--radius-full);padding:3px;background:var(--paper-raised)}
  .sw span{font-size:14px;line-height:20px;padding:6px 14px;border-radius:var(--radius-full);color:var(--ink-muted)}
  .sw .on{background:var(--ink);color:var(--paper)}
  .tag{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted);display:flex;align-items:center;gap:8px}
  .d{width:8px;height:8px;border-radius:var(--radius-full);background:var(--vermilion)}
  .cap{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted);margin-top:14px}
</style>
<div class="row">
  <div><div class="sw"><span class="on">Partner</span><span>Scribe</span></div><div class="cap">Switch · alone</div></div>
  <div><div class="sw"><span>Partner</span><span class="on">Scribe</span></div><div class="cap">Switch · someone's watching</div></div>
  <div><div class="tag"><span class="d"></span>Scribe · your words only</div><div class="cap">Corner label in Room view</div></div>
</div>
