<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;800;900&family=Geist+Mono:wght@400;500&display=swap">
<style>
  body{margin:0;background:var(--paper);font-family:var(--font-mono)}
  .row{display:flex;gap:64px;padding:40px;align-items:flex-end}
  .st{display:flex;flex-direction:column;align-items:center;gap:16px}
  .d{width:40px;height:40px;border-radius:var(--radius-full)}
  .idle{background:transparent;box-shadow:inset 0 0 0 1.5px var(--ink-muted)}
  .live{background:var(--vermilion);animation:breathe 1.6s cubic-bezier(.2,0,0,1) infinite}
  .think{background:var(--vermilion);opacity:.35}
  .lab{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted)}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
  @media (prefers-reduced-motion:reduce){.live{animation:none}}
</style>
<div class="row">
  <div class="st"><div class="d idle"></div><div class="lab">Idle</div></div>
  <div class="st"><div class="d live"></div><div class="lab">Listening</div></div>
  <div class="st"><div class="d think"></div><div class="lab">Settling</div></div>
</div>
