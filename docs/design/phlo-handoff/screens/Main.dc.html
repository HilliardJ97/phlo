<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Start a draft</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#f7f7f4}
a{color:#16171a}a:hover{color:#66665f}
button{font-family:inherit}
</style>
</helmet>
<div style="font-family: Geist, 'Helvetica Neue', system-ui, sans-serif; background: #f7f7f4; color: #16171a; min-height: 900px; display: flex; flex-wrap: wrap">
<nav aria-label="Main" style="width: 64px; flex: 0 0 64px; border-right: 1px solid #e4e4df; display: flex; flex-direction: column; align-items: center; padding: 20px 0; gap: 20px; box-sizing: border-box; min-height: 900px">
<a href="Sidebar.dc.html" aria-label="Open sidebar" style="display: flex; padding: 8px"><svg aria-hidden="true" width="20" height="22" viewBox="0 0 117 130"><path d="M50 0 A50 50 0 0 0 50 100 Z" fill="#e5432a"/><path d="M57 0 H117 V130 L87 100 H57 Z" fill="#16171a"/></svg></a>
<button aria-label="New draft" style="width: 36px; height: 36px; border-radius: 999px; border: 1px solid #e4e4df; background: transparent; color: #66665f; font-size: 18px; line-height: 1; cursor: pointer">+</button>
</nav>
<main style="flex: 999 1 560px; min-width: 0; position: relative; min-height: 900px">
<header style="display: flex; align-items: center; justify-content: space-between; padding: 18px 32px; gap: 16px; flex-wrap: wrap">
<div style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; line-height: 16px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: #66665f">Drafts / New</div>
<div style="display: flex; align-items: center; gap: 12px">
<div role="group" aria-label="Phlo's role" style="display: inline-flex; border: 1px solid #e4e4df; border-radius: 999px; padding: 3px; background: #ffffff">
<button style="font-family: Geist, 'Helvetica Neue', system-ui, sans-serif; font-size: 13px; line-height: 18px; padding: 5px 12px; border: 0; border-radius: 999px; cursor: pointer; background: #16171a; color: #f7f7f4">Partner</button>
<button style="font-family: Geist, 'Helvetica Neue', system-ui, sans-serif; font-size: 13px; line-height: 18px; padding: 5px 12px; border: 0; border-radius: 999px; cursor: pointer; background: transparent; color: #66665f">Scribe</button>
</div>

<button aria-label="More" style="width: 36px; height: 36px; border: 0; background: transparent; color: #66665f; font-size: 18px; cursor: pointer">···</button>
</div>
</header>
<div style="max-width: 680px; margin: 0 auto; padding: 56px 32px 200px">
<div style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; line-height: 16px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: #66665f">Nov 18 · Draft</div>
<h1 style="font-family: Geist, 'Helvetica Neue', system-ui, sans-serif; margin: 24px 0 16px; font-size: 64px; line-height: 64px; font-weight: 400; letter-spacing: -0.035em; color: #16171a">Start talking.</h1>
<p style="font-family: Geist, 'Helvetica Neue', system-ui, sans-serif; margin: 0 0 10px; font-size: 16px; line-height: 26px; color: #66665f">Or just type. Phlo will organize it as you go.</p>
<div style="margin-top: 72px; display: flex; gap: 24px; flex-wrap: wrap">
<div style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; line-height: 16px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: #66665f">Space · hold to talk</div><div style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; line-height: 16px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: #66665f">⌘V · paste a reference</div>
</div>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 36px; display: flex; flex-direction: column; align-items: center; gap: 12px">
<button aria-label="Talk" style="border: 0; background: transparent; padding: 0; cursor: pointer; display: flex"><span style="width: 40px; height: 40px; border-radius: 999px; box-shadow: inset 0 0 0 1.5px #66665f"></span></button>
<div style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; line-height: 16px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: #66665f">Hold space to talk</div>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
