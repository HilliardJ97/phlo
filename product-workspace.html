.inline-actions .remove-artifact:hover{color:#9d3f27;background:#f5e8df}
.inline-content .wireframe{margin:12px auto;user-select:auto;max-width:100%}
.inline-head{display:flex;align-items:center;justify-content:space-between}
.selection-bar{flex-wrap:wrap;align-items:center;max-width:calc(100vw - 20px)}
.selection-bar :is(.selection-formatting,.selection-tools){display:flex;gap:2px;align-items:center;flex-wrap:wrap}
.selection-bar .selection-tools{border-left:1px solid var(--line);padding-left:4px}
.selection-bar .heading-picker{min-width:48px;font-weight:650}
.selection-bar .format-bold{font-weight:750}
.selection-bar .format-italic{font-style:italic}
.selection-bar .format-underline{text-decoration:underline}
.selection-bar .format-strikeThrough{text-decoration:line-through}
.selection-bar button[aria-pressed="true"]{background:var(--tint);color:var(--orange-dark)}
@media(max-width:700px){.selection-bar .selection-tools{border-left:0;padding-left:0}}
.finished-document{grid-column:1/-1;max-width:790px;width:100%;margin:0 auto;padding:22px}
#artifactGrid:has(.finished-document){display:block}
#artifactGrid:has(.finished-document) .back{margin-bottom:12px}
#createDeliverable{background:var(--orange-dark);font-weight:650}
#createDeliverable:hover{background:#913f23}
body:has(#documentView.hidden) :is(#createDeliverable,#cleanDocument){display:none}
.editor h2,.inline-content.text-preview h2,.formatted-preview h2{
 color:#a44d32;font-size:21px;line-height:1.35;letter-spacing:-.25px;text-transform:none;font-weight:650;
}
.editor h3,.formatted-preview h3{color:#853f2b;font-size:16px;font-weight:650}
.editor .question-callout,.formatted-preview .question-callout{
 background:#eef4ec;color:#2f593f;border:1px solid #d2e2d1;border-left:3px solid #62876b;
 border-radius:7px;padding:12px 15px;margin:15px 0 20px;font-size:14px;line-height:1.55;
}
.question-callout>strong{display:block;font-size:11px;letter-spacing:.3px;margin-bottom:4px}
.editor .question-callout p,.formatted-preview .question-callout p{margin:0;color:inherit;min-height:0}
.cleanup-standard{margin-top:12px;color:var(--sub);font-size:12px}
.cleanup-standard summary{cursor:pointer}
.cleanup-standard ul{padding-inline-start:18px}
@media(max-width:700px){.topbar:has(#cleanDocument){height:auto;min-height:60px;flex-wrap:wrap;padding-block:8px}.top-actions{flex-wrap:wrap}}
#generationStatus:empty{display:none}
.wireframe-design-note{white-space:pre-wrap}
.editor li > :is(ul,ol){margin:4px 0 0;padding-inline-start:24px}

.pinned-note{
 position:relative;margin:7px 0 10px 15px;padding:7px 11px;border-left:2px solid #c36440;
 border-radius:0 6px 6px 0;background:#faece3;color:#744530;line-height:1.5;
}
.pinned-note::before{content:'↳';position:absolute;left:-16px;top:7px;color:#a84e2d}
.unattached-pin::before{content:'Unattached note';position:static;display:block;font-size:11px;font-weight:650}
#contextMenu{max-height:calc(100dvh - 24px);overflow-y:auto}

.voice-panel{position:fixed;z-index:35;left:calc(50% + 109px);bottom:22px;transform:translateX(-50%);width:max-content;max-width:calc(100vw - 24px)}
.voice-panel,#voiceCommands{--voice-glass:rgb(204 209 210 / .54);--voice-edge:rgb(103 113 118 / .23);--voice-shadow:0 8px 24px #26343c15}
.voice-dock{display:flex;align-items:center;gap:6px;padding:6px 8px;background:var(--voice-glass);border:1px solid var(--voice-edge);border-radius:24px;box-shadow:var(--voice-shadow);backdrop-filter:blur(14px)}
.voice-orb{flex:none;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 28%,#f1f4f5cf,#88969aab 58%,#59676dba);box-shadow:inset 0 0 0 1px #39444926}
.voice-panel[data-state="listening"] .voice-orb{box-shadow:0 0 0 3px #66798036}
.voice-panel[data-state="working"] .voice-orb{animation:voice-breathe 1.6s ease-in-out infinite alternate}
@keyframes voice-breathe{to{box-shadow:0 0 0 5px #66798035}}
@media(prefers-reduced-motion:reduce){.voice-panel[data-state="working"] .voice-orb{animation:none}}
#voiceStatus{font-size:12px;max-width:210px;line-height:1.25;margin-inline:3px}
.voice-dock .quiet{border-radius:15px}
#toggleVoice{background:#53626826;color:#273338}
#toggleVoice:hover{background:#5362683d}
#closeVoice{font-size:19px;color:var(--sub)}
.voice-transcript{max-height:175px;overflow:auto;white-space:pre-wrap;background:var(--voice-glass);border:1px solid var(--voice-edge);border-radius:12px;box-shadow:var(--voice-shadow);backdrop-filter:blur(14px);padding:12px 15px;margin:0 0 9px;font-size:13px}
#voiceCommands{position:fixed;z-index:34;right:18px;top:84px;width:min(315px,calc(100vw - 32px));max-height:calc(100dvh - 180px);overflow:auto;overscroll-behavior:contain}
#voiceCommands:empty,body:has(#documentView.hidden) :is(.voice-panel,#voiceCommands,#voiceButton){display:none}
.voice-command{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:7px 9px;align-items:start;background:var(--voice-glass);border:1px solid var(--voice-edge);border-radius:12px;backdrop-filter:blur(14px);padding:10px;margin:0 0 8px;font-size:12px}
.voice-command .voice-orb{width:21px;height:21px}

.voice-command p{margin:0;align-self:center}
.voice-command-actions,.voice-format-preview{grid-column:2 / -1}
.voice-command-actions{display:flex;justify-content:flex-end}
.voice-command .voice-dismiss{font-size:17px;line-height:1;padding:1px 4px;border-radius:5px}
@media(max-width:900px){.voice-panel{left:50%}}
@media(max-width:500px){#voiceStatus{max-width:95px}.voice-dock{gap:2px}.voice-dock .quiet{padding-inline:7px}}
body.present .voice-panel{left:50%}
.outline-top{display:flex;align-items:center;justify-content:space-between;gap:4px;margin-bottom:7px}
.on-page .outline-top .eyebrow{margin:0}
.on-page .outline-top button{width:26px;text-align:center;padding:0;border:1px solid var(--line);border-radius:6px;line-height:24px;font-size:14px}
.on-page button[data-level="3"]{padding-left:16px}
.slash-menu{max-height:min(390px,calc(100dvh - 24px));overflow:auto}
.slash-menu .command-label{flex:1;text-align:left}
.slash-menu .command-shortcut{font:11px var(--font);color:var(--sub);padding-left:12px}
.slash-menu button[aria-current="true"]{background:var(--tint)}
.voice-archive{margin:10px 0;padding:7px 11px;border:1px solid var(--line);border-radius:6px;color:var(--sub)}
.voice-archive summary{cursor:pointer}
.document-image,.image-preview{margin:12px 0 20px}
.document-image img,.image-preview img{display:block;max-width:100%;max-height:460px;object-fit:contain;border:1px solid var(--line);border-radius:10px}
.document-image .image-caption{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:5px;color:var(--sub);font-size:12px}
.voice-format-preview{max-height:86px;overflow:auto;margin:6px 0;padding-left:5px}
</style>
</head>
<body>
<div class="shell">
<aside class="sidebar" id="sidebar">
<div class="brand"><svg class="brandmark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#a84e2d"/><path d="M11 24V9h7a4 4 0 0 1 0 8h-7m5 5h5" fill="none" stroke="#fcfaf6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Phlo</span></div>
<nav class="nav"><button id="documentsNav" class="active"></button><button id="deliverablesNav"></button></nav>
<div class="side-label"><span class="eyebrow">Documents</span><button class="icon" id="newDocument" aria-label="New document"></button></div>
<div class="side-docs" id="docList"></div>
<div class="side-middle"><div class="eyebrow">Context</div><p>Screenshots and notes for this document.</p><button class="mini-ref" id="sideReference" aria-label="Open context" style="width:100%;padding:0"><div class="mini-ref-placeholder">Add screenshots or notes</div><span class="mini-ref-label">Current experience</span></button></div>
<div class="side-bottom"><button id="connectionButton"></button><button id="helpButton"></button><div style="display:flex;align-items:center;gap:9px;margin-top:17px"><div class="avatar">P</div><div class="small">Local workspace</div></div></div>
</aside>
<main class="main">
<header class="topbar"><div class="breadcrumb"><button class="icon mobile-toggle" id="mobileToggle" aria-label="Open navigation"></button><span id="breadcrumbParent">Documents</span><span style="color:#b9b6ac">/</span><span id="breadcrumbTitle">Untitled</span></div><div class="top-actions"><span class="preview-label">Local workspace</span><span class="muted small" id="generationStatus" role="status"></span><span class="saved" id="saved">Saved locally</span><button class="quiet" id="presentButton"></button><button class="quiet" id="voiceButton" aria-expanded="false">Talk</button><button class="quiet" id="cleanDocument" title="Clean up the whole document">Clean</button><button class="primary" id="createDeliverable">Create deliverable</button><button class="icon" id="moreButton" aria-label="Workspace options"></button></div></header>
<section class="view" id="documentView"><div class="doc-layout"><article class="document"><div class="doc-top"><span class="doc-icon" id="docIcon"></span><span class="eyebrow hidden" id="frameworkLabel"></span></div><input class="doc-title" id="docTitle" aria-label="Document title" value="" placeholder="Untitled" maxlength="120"><div class="doc-meta"><span>Working notes</span><span class="sep"></span><span>Just now</span></div><div class="editor" id="editor" contenteditable="true" spellcheck="true" role="textbox" aria-label="Product thinking document" aria-multiline="true"></div><div class="bottom-hint" id="writingHint"></div></article><nav class="on-page" id="onPage" aria-label="On this page"></nav></div></section>
<section class="view deliverables hidden" id="deliverablesView"><div class="page-heading"><div><h1>Deliverables</h1><p>Finished copies of your notes.</p></div><span class="pill">Local workspace</span></div><div class="filters" id="filters"></div><div class="artifact-grid" id="artifactGrid"></div></section>
<section class="view detail hidden" id="detailView"><button class="back" id="backToDeliverables"></button><div class="detail-top"><div><h1 class="detail-title" id="artifactTitle"></h1><div class="detail-sub" id="artifactSubtitle"></div></div><div style="display:flex;gap:7px"><button class="secondary" id="exportArtifact"></button><button class="secondary" id="insertArtifact"></button></div></div><div class="detail-layout"><div><div class="artifact-stage" id="artifactStage"></div><div class="wf-annotation" id="stageAnnotation"></div></div><aside class="inspector" id="inspector"></aside></div></section>
</main></div>
<aside id="voiceCommands" aria-label="Talk feedback"></aside>
<section id="voicePanel" class="voice-panel hidden" aria-label="Talk through it">
 <div id="voiceTranscript" class="voice-transcript hidden" aria-label="Live transcript"></div>
 <div class="voice-dock">
  <span class="voice-orb" aria-hidden="true"></span>
  <span id="voiceStatus" role="status">Mic off</span>
  <button id="toggleTranscript" class="quiet" aria-controls="voiceTranscript" aria-expanded="false">Transcript</button>
  <button id="retryVoice" class="quiet hidden">Retry</button>
  <button id="toggleVoice" class="quiet">Start talking</button>
  <button id="closeVoice" class="icon" aria-label="Close Talk">×</button>
 </div>
</section>
<div id="selectionBar" class="selection-bar hidden" role="toolbar" aria-label="Selection actions"></div>
<div id="contextMenu" class="menu hidden" role="menu" aria-label="Document actions"></div>
<div id="slashMenu" class="menu slash-menu hidden" role="menu" aria-label="Writing commands"></div>
<div id="moreMenu" class="menu hidden" role="menu"></div>
<div class="overlay hidden" id="overlay"><section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" tabindex="-1"></section></div>
<div class="toast hidden" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="inlineImageInput" accept="image/png,image/jpeg,image/webp" hidden>
<input type="file" id="referenceInput" accept="image/png,image/jpeg,image/webp" multiple hidden>
<input type="file" id="workspaceInput" accept="application/json,.json" hidden>
<script id="reference-seed" type="application/json">[]</script>
<script src="product-workspace.js" defer></script>
</body></html>
